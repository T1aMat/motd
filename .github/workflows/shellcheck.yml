name: ShellCheck and smoke test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck \
            scripts/install.sh \
            tests/smoke.sh \
            motd/[0-9]*

  smoke:
    name: MOTD smoke test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify MOTD modules are executable
        run: |
          for file in motd/[0-9]*; do
            if [[ ! -x "$file" ]]; then
              echo "::error file=$file::MOTD module is not executable"
              exit 1
            fi
          done

      - name: Run MOTD smoke test
        run: bash tests/smoke.sh
